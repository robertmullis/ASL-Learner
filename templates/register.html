<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hands Talk</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="icon" type="image/x-icon" href="../static/sign_language_icon.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
    <script src="{{ url_for('static', filename='js/register.js') }}" defer></script>

</head>

<body>
    <h1>
        <span class="material-symbols-outlined">sign_language</span>
        Hands Talk
    </h1>

    <div class="form-box">
        <form action="/register" method="POST">
                <fieldset>
                    <legend>Register</legend>

                    <div class="form-group">
                        <label for="username"><b>Username</b></label>
                        <input type="text" id="username" class="curved-input" placeholder="Choose Username" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="email"><b>Email</b></label>
                        <input type="email" id="email" class="curved-input" placeholder="email@example.com" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password"><b>Password</b></label>
                        <input type="password" id="password" class="curved-input" oninput="checkStrength(this.value)" placeholder="Choose Password" name="password" required >
                        <div style="display:flex; gap:4px; margin: 8px 0;">
                            <div class="strength-bar" id="b1"></div>
                            <div class="strength-bar" id="b2"></div>
                            <div class="strength-bar" id="b3"></div>
                            <div class="strength-bar" id="b4"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password"><b>Confirm Password</b></label>
                        <input type="password" id="confirm_password" class="curved-input" placeholder="Re-Enter Password" name="confirm_password" required>
                    </div>

                    {% if error %}
                        <p class="error">{{ error }}</p>
                    {% endif %}

                    {% if message %}
                        <p class="success">{{ message }}</p>
                    {% endif %}

                    <button type="submit">Register</button>
                </fieldset>
                <p>Already have an account? <a href="/login">Sign in</a></p>
        </form>
    </div>
</body>

</html>
