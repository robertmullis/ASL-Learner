<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Flashcards</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="icon" type="image/x-icon" href="../static/sign_language_icon.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flashcards.css') }}">
    <script src="{{ url_for('static', filename='js/flashcards.js') }}" defer></script>

</head>

<body>
    <header>
        <a class="logo" href="/">
            <span class="material-symbols-outlined">sign_language</span>
            Hands Talk
        </a>
        <div class="header-right">
            <span class="username-pill">
                <span class="material-symbols-outlined">person</span>
                {{ username }}
            </span>
            <a class="logout-link" href="/logout">Logout</a>
        </div>
    </header>

    <main>
        <div class="page-header">
            <a class="back-link" href="/">
                <span class="material-symbols-outlined">arrow_back</span>
                Back to dashboard
            </a>
            <h1>ASL Alphabet Flashcards</h1>
            <p>Click a card (or press Space) to flip it. Use arrow keys to navigate.</p>
        </div>

        <div class="progress-wrap">
            <div class="progress-meta">
                <span class="progress-label">Progress</span>
                <span class="progress-count" id="progress-count">1 / 26</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill" style="width: 3.8%"></div>
            </div>
        </div>

        <div class="card-scene" id="card" onclick="flipCard()">
            <div class="card-inner" id="card-inner">
                <div class="card-face card-front">
                    <div class="card-letter" id="front-letter">A</div>
                    <div class="card-hint">
                        <span class="material-symbols-outlined">touch_app</span>
                        Click to reveal hand shape
                    </div>
                </div>
                <div class="card-face card-back">
                    <div class="card-back-letter" id="back-letter">A</div>
                    <img id="back-image" style="display:none; width: 150px; height: 150px; object-fit: contain; margin-bottom: 16px; border-radius: 8px;" alt="ASL hand shape">
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="nav-btn" id="prev-btn" onclick="navigate(-1)" disabled>
                <span class="material-symbols-outlined">arrow_back</span>
                <span class="text">Prev</span>
            </button>
            <button class="flip-btn" onclick="flipCard()">
                <span class="material-symbols-outlined">flip</span>
                Flip card
            </button>
            <button class="nav-btn" id="next-btn" onclick="navigate(1)">
                <span class="text">Next</span>
                <span class="material-symbols-outlined">arrow_forward</span>
            </button>
        </div>

        <div class="dots-wrap" id="dots-wrap"></div>
    </main>

</body>
</html>
