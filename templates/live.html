<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Practice – Hands Talk</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/live.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <script src="{{ url_for('static', filename='js/live.js') }}" defer></script>
</head>
<body>
    <header>
        <a class="logo" href="/">
            <span class="material-symbols-outlined">sign_language</span>
            Hands Talk
        </a>
        <div class="header-right">
            <span class="username-pill">
                <span class="material-symbols-outlined">person</span>
                {{ username }}
            </span>
            <a class="logout-link" href="/logout">Logout</a>
        </div>
    </header>

    <main>
        <div class="welcome">
            <a class="back-link" href="/">
                <span class="material-symbols-outlined">arrow_back</span>
                Back to dashboard
            </a>
            <h1>Live Practice</h1>
            <p>Hold up a hand sign and see it recognized in real time.</p>
        </div>

        <div class="live-wrapper">
            <div class="video-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="capture" style="display:none"></canvas>
                <div class="overlay">
                    <div class="predicted-letter" id="letter">–</div>
                    <div class="status-bar" id="status">Starting camera…</div>
                </div>
            </div>
            <p class="tip">Position your hand clearly in front of the camera..</p>
        </div>
    </main>
</body>
</html>
