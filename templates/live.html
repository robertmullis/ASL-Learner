<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Practice – Hands Talk</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <script src="{{ url_for('static', filename='js/live.js') }}" defer></script>
    <style>
        .live-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 32px 16px;
        }
        .video-container {
            position: relative;
            width: 640px;
            max-width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            background: #111;
        }
        video {
            width: 100%;
            display: block;
            transform: scaleX(-1); /* mirror */
        }
        .overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            pointer-events: none;
        }
        .predicted-letter {
            font-size: 96px;
            font-weight: 700;
            line-height: 1;
            color: #00c85a;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
            transition: color 0.2s;
        }
        .predicted-letter.no-hand {
            font-size: 18px;
            color: #888;
        }
        .status-bar {
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
        }
        .tip {
            color: #888;
            font-size: 14px;
            max-width: 500px;
            text-align: center;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 16px;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #00c85a;
        }
        .back-link .material-symbols-outlined {
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="/">
            <span class="material-symbols-outlined">sign_language</span>
            Hands Talk
        </a>
        <div class="header-right">
            <span class="username-pill">
                <span class="material-symbols-outlined">person</span>
                {{ username }}
            </span>
            <a class="logout-link" href="/logout">Logout</a>
        </div>
    </header>

    <main>
        <div class="welcome">
            <a class="back-link" href="/">
                <span class="material-symbols-outlined">arrow_back</span>
                Back to dashboard
            </a>
            <h1>Live Practice</h1>
            <p>Hold up a hand sign and see it recognized in real time.</p>
        </div>

        <div class="live-wrapper">
            <div class="video-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="capture" style="display:none"></canvas>
                <div class="overlay">
                    <div class="predicted-letter" id="letter">–</div>
                    <div class="status-bar" id="status">Starting camera…</div>
                </div>
            </div>
            <p class="tip">Position your hand clearly in front of the camera..</p>
        </div>
    </main>
</body>
</html>
