<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Learner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --bg: #6697bd;
            --card-bg: #f5f8fd;
            --primary: #5784a4;
            --primary-dark: #446881;
            --primary-light: #dce9f3;
            --text-dark: #2d3748;
            --text-mid: #4a5568;
            --text-light: #718096;
            --white: #F8FAFC;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo .material-symbols-outlined { font-size: 1.5rem; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .username-pill {
            background: rgba(255, 255, 255, 0.2);
            color: var(--white);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .username-pill .material-symbols-outlined { font-size: 1rem; }

        .logout-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .logout-link:hover { color: var(--white); text-decoration: underline; }

        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 44px 28px 72px;
        }

        .welcome {
            margin-bottom: 44px;
        }

        .welcome h1 {
            font-size: 2.1rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 6px;
        }

        .welcome p {
            color: rgba(255, 255, 255, 0.75);
            font-size: 1rem;
        }

        .section-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 16px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 48px;
        }

        .category-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.13);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
        }

        .category-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }

        .category-icon .material-symbols-outlined { font-size: 1.4rem; }

        .icon-green  { background: #d4edda; color: #2d7a50; }
        .icon-amber  { background: #fef3c7; color: #a16207; }
        .icon-purple { background: #ede9fe; color: #6d28d9; }

        .category-card h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .category-card p {
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.55;
            flex: 1;
            margin-bottom: 20px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 9px 8px;
            border-radius: 10px;
            font-family: "DM Sans", sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn .material-symbols-outlined { font-size: 1rem; }
        .btn:active { transform: scale(0.96); }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .btn-primary:hover { background: var(--primary-dark); }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover { background: var(--primary-light); }

        .modal {
            display: none; /* Changed from modal-overlay to modal */
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9); 
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .modal-content {
            transition: transform 0.1s ease-out;
            max-width: none;
            max-height: 90vh; 
            user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        @keyframes zoomIn {
            from {transform: scale(0.7); opacity: 0;}
            to {transform: scale(1); opacity: 1;}
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 35px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        #expandable-img:hover {
            opacity: 0.85;
        }

        .zoom-viewport {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: zoom-out; /* Clicking the empty space closes the modal */
        }

        .modal-content {
            transition: transform 0.1s ease-out; /* Smooth zooming */
            max-width: none;  /* Allow it to exceed screen width */
            max-height: 90vh; 
            user-select: none;
        }

        .zoom-controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10001;
            pointer-events: all; /* Make sure buttons are clickable */
        }

        .zoom-controls button {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }

        .zoom-controls button:hover {
            background: white;
            color: black;
        }

        @media (max-width: 640px) {
            header { padding: 14px 20px; }

            main { padding: 28px 16px 48px; }

            .welcome h1 { font-size: 1.65rem; }

            .categories-grid {
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }

            .category-card { padding: 18px 16px; }

            .card-actions { flex-direction: column; }
        }

        @media (max-width: 400px) {
            .categories-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <header>
        <a class="logo" href="/">
            <span class="material-symbols-outlined">sign_language</span>
            ASL Learner
        </a>
        <div class="header-right">
            <span class="username-pill">
                <span class="material-symbols-outlined">person</span>
                {{ username }}
            </span>
            <a class="logout-link" href="/logout">Logout</a>
        </div>
    </header>

    <main>
        <div class="welcome">
            <h1>Welcome back, {{ username }}!</h1>
            <p>Learn the ASL Alphabet and practice your signing skills.</p>
        </div>

        <div class="category-image" style="margin-bottom: 32px; display: flex; justify-content: center;">
            <img src="{{ url_for('static', filename='asl_alphabet_horizontal.jpg') }}" 
                alt="ASL Alphabet" 
                id="expandable-img"
                style="width: 50%; max-width: 800px; border-radius: 12px; cursor: zoom-in; transition: opacity 0.2s;"
                onclick="openModal()">
        </div>

        <div id="imgModal" class="modal" onclick="closeOutside(event)">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <div class="zoom-viewport" id="zoom-viewport">
                <img class="modal-content" id="fullImg" 
                    src="{{ url_for('static', filename='asl_alphabet_horizontal.jpg') }}"
                    style="transform: translate(0px, 0px) scale(1); cursor: grab;"
                    onclick="event.stopPropagation()"> 
            </div>

            <div class="zoom-controls" onclick="event.stopPropagation()">
                <button type="button" onclick="changeZoom(-0.5)">-</button>
                <button type="button" onclick="changeZoom(0.5)">+</button>
                <button type="button" onclick="resetZoom()">Reset View</button>
            </div>
        </div>

        <div class="categories-grid">

            <div class="category-card">
                <div class="category-icon icon-amber">
                    <span class="material-symbols-outlined">abc</span>
                </div>
                <h3>Learn</h3>
                <p>Study the ASL Alphabet</p>
                <div class="card-actions">
                    <a href="/flashcards" class="btn btn-primary">
                        <span class="material-symbols-outlined">style</span>
                        Flashcards
                    </a>
            </div>
        </div>

            <div class="category-card">
                <div class="category-icon icon-green">
                    <span class="material-symbols-outlined">gesture</span>
                </div>
                <h3>Practice</h3>
                <p>Test your knowledge of the ASL Alphabet.</p>
                <div class="card-actions">
                    <a href="/quiz" class="btn btn-outline">
                        <span class="material-symbols-outlined">quiz</span>
                        Quiz
                    </a>
                </div>
            </div>

        </div>
    </main>
</body>
</html>

<script>
    function openModal() {
        document.getElementById("imgModal").style.display = "flex";
    }

    function closeOutside(event) {
    // If the click happened on the viewport (the dark area), close the modal
    if (event.target.id === "zoom-viewport" || event.target.id === "imgModal") {
        closeModal();
    }
}

    // Update closeModal to reset zoom when exiting
    function closeModal() {
        document.getElementById("imgModal").style.display = "none";
        resetZoom(); // Clear zoom state for next time
    };

    let scale = 1;
    let isDragging = false;
    let startX, startY, translateX = 0, translateY = 0;

    const img = document.getElementById("fullImg");
    img.ondragstart = function() { return false; };
    const viewport = document.getElementById("zoom-viewport");

    // 1. Zoom Logic
    function changeZoom(amount) {
        scale = Math.min(Math.max(1, scale + amount), 4); // Limit zoom between 1x and 4x
        updateTransform();
    }

    function resetZoom() {
        scale = 1; translateX = 0; translateY = 0;
        updateTransform();
    }

    // 2. Panning Logic
    viewport.onmousedown = (e) => {
        e.preventDefault(); // Prevents default browser actions
        if (scale <= 1) return; // Only pan if zoomed in
        
        isDragging = true;
        img.style.cursor = 'grabbing';
        
        // Calculate the offset so the image doesn't "jump" when clicked
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
    };

    window.onmousemove = (e) => {
        if (!isDragging) return;
        
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
    };

    window.onmouseup = () => {
        isDragging = false;
        img.style.cursor = 'grab';
    };

    function updateTransform() {
        img.style.transform = `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;

        img.style.cursor = scale > 1 ? (isDragging ? 'grabbing' : 'grab') : 'default';
    }

    // 3. Mouse Wheel Zoom
    viewport.onwheel = (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.2 : 0.2;
        changeZoom(delta);
    };
</script>
